<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Create Account | Hometube</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="index.css">
    <link rel="stylesheet" href="home.css">
</head>

<body>

    <header class="signin-header">
        <a href="home.css" class="brand">
            Home<span>tube</span>
        </a>

        <a href="home.html" class="home-link">
            <i class="bi bi-house"></i> Home
        </a>
    </header>

    <main class="signin-container">
        <section class="signin-card">

            <div class="profile-icon">
                <i class="bi bi-person-plus"></i>
            </div>

            <h1>Create Account</h1>

            <p class="subtitle">
                Join Hometube and make it your own.
            </p>

            <p id="formMessage" class="message" role="status" aria-live="polite"></p>

            <form id="createAccountForm">

                <div class="form-group">
                    <label for="fullName">Full Name</label>
                    <input type="text" id="fullName" placeholder="Enter your full name" autocomplete="name" required>
                </div>

                <div class="form-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" placeholder="Choose a username" autocomplete="username" minlength="3" required>
                </div>

                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" placeholder="Enter your email" autocomplete="email" required>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" placeholder="Create a password" autocomplete="new-password" minlength="8" required>
                </div>

                <div class="form-group">
                    <label for="confirmPassword">Confirm Password</label>
                    <input type="password" id="confirmPassword" placeholder="Enter your password again" autocomplete="new-password" minlength="8" required>
                </div>

                <button type="submit" id="createAccountBtn">
                    Create Account
                </button>

            </form>

            <p class="account-switch">
                Already have an account?
                <a href="signin.html">Log In</a>
            </p>

            <a href="home.css" class="back-link">
                Back to Hometube
            </a>

        </section>
    </main>

    <script src="signin.js"></script>
</body>

</html>
