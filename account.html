<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Account | Hometube</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="account.css">
</head>

<body>
    <header class="account-header">
        <a href="home.css" class="brand">Home<span>tube</span></a>

        <a href="home.html" class="back-link">
            <i class="bi bi-house"></i> Home
        </a>
    </header>

    <main class="account-container">
        <section class="account-card">
            <div class="profile-icon">
                <i class="bi bi-person-circle"></i>
            </div>

            <h1>My Account</h1>
            <p class="subtitle">Your Hometube profile</p>

            <div class="account-details">
                <p>
                    <strong>Full name</strong>
                    <span id="accountName"></span>
                </p>

                <p>
                    <strong>Email</strong>
                    <span id="accountEmail"></span>
                </p>

                <p>
                    <strong>Username</strong>
                    <span id="accountUsername"></span>
                </p>
            </div>

            <button id="signOutBtn" class="signout-button">
                <i class="bi bi-box-arrow-right"></i> Sign Out
            </button>
        </section>
    </main>

    <script src="account.js"></script>
</body>

</html>
